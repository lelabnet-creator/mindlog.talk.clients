<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ID · mindlog</title>
    <meta name="description" content="Votre carte d'identité en ligne, simple et épurée." />
    <script>
      // Applique le thème enregistré avant le rendu pour éviter un flash.
      try {
        var t = localStorage.getItem("mindlog.theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/static/milo.svg" />
    <link rel="stylesheet" href="/static/style.css?v=__V__" />
    <!-- Visite guidée « Milo » : Shepherd.js (vendored maison, servi en propre pour le hors-ligne et la CSP). -->
    <link rel="stylesheet" href="/static/vendor/shepherd/shepherd.css?v=__V__" />
    <link rel="stylesheet" href="/static/vendor/shepherd/milo-tour.css?v=__V__" />
    <!-- PWA : manifest, couleur de thème, icônes iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mindlog id" />
  </head>
  <body>
<main id="app"><p class="loading">Chargement…</p></main>
    <footer id="footer"></footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <!-- Shepherd.js (UMD, expose window.Shepherd) — moteur de la visite guidée de Milo. -->
    <script src="/static/vendor/shepherd/shepherd.min.js?v=__V__" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script>
      window.__APP_V__ = "__V__";
      window.__APP_VERSION__ = "%%APP_VERSION%%";
      window.__TURNSTILE_SITE_KEY__ = "%%TURNSTILE_SITE_KEY%%";
      window.__CALENDAR_URL__ = "%%CALENDAR_URL%%";
    </script>
    <!-- Import map : les modules internes importent « ../app.js » SANS ?v= ;
         sans cette redirection, cette URL nue serait un module DIFFÉRENT de
         « app.js?v=__V__ » chargé ci-dessous → app.js évalué DEUX FOIS (double
         enregistrement des plugins/listeners : double sonnerie, double QR…). -->
    <script type="importmap">
      { "imports": { "/static/app.js": "/static/app.js?v=__V__" } }
    </script>
    <script type="module">
      // Prep bascule client/backend : si le backend ne templatise plus la page
      // (placeholder `%%APP_VERSION%%` non substitué), la config runtime est
      // récupérée via l'API `/api/config`. En mode templaté (valeurs déjà
      // injectées), c'est un no-op — aucune requête, comportement identique.
      // Ce module s'exécute avant `app.js` (ordre des modules), donc les globales
      // sont prêtes quand l'app démarre.
      if (String(window.__APP_VERSION__).indexOf("%%") === 0) {
        try {
          const cfg = await fetch("/api/config").then((r) => r.json());
          window.__APP_VERSION__ = cfg.appVersion;
          window.__TURNSTILE_SITE_KEY__ = cfg.turnstileSiteKey;
          // Base de mindlog·calendar (liens « Agenda ») ; "" si non configurée.
          window.__CALENDAR_URL__ = cfg.calendarUrl || "";
          // ⚠ Jeton d'assets : NE PAS écraser un `__V__` déjà substitué (edge).
          // L'edge ne templatise QUE `__V__` : avant ce garde, la condition `%%`
          // (vraie en prod scindée) remplaçait le jeton edge (secondes) par
          // `assetVersion` du backend (millisecondes) → URLs de modules
          // incohérentes entre shell et plugins (mélange de versions).
          if (String(window.__APP_V__).indexOf("__") === 0) {
            window.__APP_V__ = cfg.assetVersion;
          }
        } catch (_) {
          /* réseau indisponible : on conserve les valeurs en place */
        }
      }
    </script>
    <script src="/static/app.js?v=__V__" type="module"></script>
    <script>
      // Coquille PWA : enregistre le service worker (offline shell + installable).
      //
      // PORTÉE « /app » et non « / ». Sur `talk.<apex>`, l'edge sert la VITRINE
      // (Astro) sur `/`, `/fr/*` et `/en/*`, et l'app sur le reste. Un SW de
      // portée racine interceptait donc aussi les pages de la vitrine et les
      // servait depuis son cache : après un déploiement de la vitrine, tout
      // visiteur ayant déjà ouvert l'app continuait de voir l'ancienne version.
      // Le script reste servi depuis `/sw.js` — une inscription peut toujours
      // RESTREINDRE sa portée sous le chemin du script, jamais l'élargir.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          // Les inscriptions déjà posées à la racine ne disparaissent pas toutes
          // seules : sans ce nettoyage, l'ancienne continuerait de contrôler la
          // vitrine chez tous les utilisateurs existants.
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              regs.forEach(function (r) {
                try {
                  if (new URL(r.scope).pathname === "/") r.unregister();
                } catch (_) { /* portée illisible : on n'y touche pas */ }
              });
            })
            .catch(function () { /* non critique */ });

          // Promesse exposée : `push-client.js` en a besoin pour retrouver
          // l'inscription depuis une page HORS portée (/me, /@handle, /k, /i),
          // où `navigator.serviceWorker.ready` ne résout jamais.
          window.__SW_REG__ = navigator.serviceWorker
            .register("/sw.js", { scope: "/app" })
            .catch(function () { /* non critique */ });
        });
      }
    </script>
    <script src="/static/push-client.js?v=__V__" defer></script>
    <script src="/static/local-db.js?v=__V__" defer></script>
  </body>
</html>
