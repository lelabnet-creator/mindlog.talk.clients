          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/messages/{handle}/{id}:
    delete:
      operationId: deleteMessage
      summary: Supprime un message (par id numérique ou clientMsgId)
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identifiant numérique du message ou clientMsgId
      responses:
        '200':
          description: Message supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: Réservé aux contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/messages/{handle}/{id}/burn:
    post:
      operationId: burnMessage
      summary: Brûle (supprime) un message à lecture unique après révélation
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Message brûlé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: Réservé aux contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/messages/{handle}/react:
    post:
      operationId: reactToMessage
      summary: Ajoute ou retire une réaction emoji sur un message
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                messageId:
                  type: integer
                clientMsgId:
                  type: string
                emoji:
                  type: string
      responses:
        '200':
          description: Réaction basculée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Réaction invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Réservé aux contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/attachments/{handle}:
    post:
      operationId: uploadAttachment
      summary: Téléverse une pièce jointe chiffrée (blob opaque) pour la conversation
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
