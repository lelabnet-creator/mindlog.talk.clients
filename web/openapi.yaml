openapi: 3.1.0
info:
  title: mindlog · id — API
  version: 0.3.1
  description: |
    Carte d'identité en ligne (1 page + API + MCP).

    ## Authentification
    Deux mécanismes, résolus par `currentIdentity()` :
    1. **Cookie de session** `mindlog_session` (HttpOnly, Secure, SameSite=Lax) —
       posé après login passkey ou échange clé→session. Préféré pour le navigateur.
       Pour les méthodes non sûres (POST/PUT/PATCH/DELETE), l'en-tête `Origin` est
       vérifié quand il est présent (protection CSRF).
    2. **Clé d'accès** — secret de 24 octets (base64url). Transmis soit par l'en-tête
       `X-Access-Key`, soit par le paramètre de requête `?key=...`. Utilisé par les
       liens privés `/k/{clé}`, le serveur MCP et le flux SSE.

    Les routes « contacts » exigent une relation **réciproque** entre les deux handles.
    Les routes « publiques » n'exigent rien (un viewer authentifié élargit la réponse).

    ## Sécurité transverse
    - **Rate-limiting** (par IP) : `429 Too Many Requests` + `Retry-After`.
      Backstop global de 300 req/min sur `/api/*` ; limites strictes sur
      `POST /api/identities` (10/h), `POST /api/recover` (5/15 min),
      `POST /api/passkeys/auth/*` (20/15 min), `GET /api/search` (60/min).
    - **Taille du corps** : `413` au-delà de 256 Ko (JSON) ou 55 Mo (multipart).
    - **CSRF** : pour une mutation authentifiée par cookie, l'`Origin` (ou à
      défaut le `Referer`) doit correspondre à l'origine de l'app.
    - **En-têtes** : CSP, `X-Frame-Options: DENY`, `X-Content-Type-Options`,
      `Referrer-Policy: strict-origin-when-cross-origin`, HSTS (hors localhost).
servers:
  - url: https://id.mindlog.today
    description: Production
  - url: http://localhost:8787
    description: Développement local

tags:
  - name: Identités
  - name: Auth & Sessions
  - name: Passkeys
  - name: Carte (champs)
  - name: Agenda & Disponibilité
  - name: Relations
  - name: Demandes de RDV
  - name: Messagerie (E2E)
  - name: Photo & Galerie
  - name: Notifications & Temps réel
  - name: Système
  - name: MCP
  - name: OAuth 2.1
  - name: Groupes (E2E)
  - name: Coffre E2E
  - name: Multi-appareils & Prekeys
  - name: Vérification (Safety Number)
  - name: Lives
  - name: Espace Premium
  - name: Pages payantes
  - name: Stockage tiers
  - name: Facturation
  - name: Admin
  - name: Dev

components:
  securitySchemes:
    oauth2Bearer:
      type: http
      scheme: bearer
      description: Jeton d’accès OAuth 2.1 (Bearer) pour les ressources protégées (ex. /oauth/agenda).
    sessionCookie:
      type: apiKey
      in: cookie
      name: mindlog_session
    accessKeyHeader:
      type: apiKey
      in: header
      name: X-Access-Key
    accessKeyQuery:
      type: apiKey
      in: query
      name: key
    oauth2:
      type: oauth2
      description: OAuth 2.1 (Authorization Code + PKCE S256, DCR). mindlog est AS + RS.
      flows:
        authorizationCode:
          authorizationUrl: https://id.mindlog.today/oauth/authorize
          tokenUrl: https://id.mindlog.today/oauth/token
          refreshUrl: https://id.mindlog.today/oauth/token
          scopes:
            "mindlog:identity": Gérer la carte d'identité du compte connecté
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
    CardField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string }
        is_custom: { type: integer, enum: [0, 1] }
        is_public: { type: integer, enum: [0, 1] }
        visibility: { type: string, enum: [public, contact, private] }
        position: { type: integer }
    CardEvent:
      type: object
      properties:
        id: { type: integer }
        identity_id: { type: integer }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        location: { type: string }
        notes: { type: string }
        is_public: { type: integer, enum: [0, 1] }
    RelationSummary:
      type: object
      properties:
        handle: { type: string }
        display_name: { type: string }
        has_photo: { type: boolean }
        type: { type: string, enum: [amis, pro, autre] }
        via: { type: string }
        mutual: { type: boolean }
    BookingRequest:
      type: object
      properties:
        id: { type: integer }
        identity_id: { type: integer }
        day: { type: string, nullable: true }
        time: { type: string, nullable: true, description: 'Créneau HH:MM' }
        name: { type: string }
        email: { type: string }
        message: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        created_at: { type: string, format: date-time }
    Availability:
      type: object
      description: Règle de disponibilité générale (défaut par jour de semaine + périodes + horaires).
      properties:
        weekdays:
          type: array
          description: 7 booléens, jours libres par défaut (index 0 = lundi … 6 = dimanche).
          items: { type: boolean }
        periods:
          type: array
          description: Périodes datées imposant un statut (vacances « off », dispo exceptionnelle « on »).
          items:
            type: object
            properties:
              from: { type: string, example: '2026-08-01' }
              to: { type: string, example: '2026-08-15' }
              free: { type: boolean }
        start: { type: string, example: '09:00', description: Début de journée }
        end: { type: string, example: '18:00', description: Fin de journée }
        slot_minutes: { type: integer, enum: [15, 30, 60], description: Finesse des créneaux }
    Settings:
      type: object
      description: Préférences du compte (onglet « Options »).
      properties:
        allow_chat: { type: boolean }
        allow_call: { type: boolean }
        allow_video: { type: boolean }
        allow_requests: { type: boolean }
        public_availability: { type: boolean }
        availability: { $ref: '#/components/schemas/Availability' }

security:
  - sessionCookie: []
  - accessKeyHeader: []
  - accessKeyQuery: []

paths:
  /api/search:
    get:
      operationId: searchIdentities
      summary: Recherche d'identités par handle ou nom affiché
      tags:
        - Identités
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Terme de recherche (vide renvoie une liste vide)
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        handle:
                          type: string
                        display_name:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                          description: Présent uniquement si le visiteur est Premium

  /api/identities/{handle}:
    get:
      operationId: getPublicIdentity
      summary: Consulte la carte publique d'une identité par handle
      tags:
        - Identités
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Carte publique de l'identité
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle:
                    type: string
                  fields:
                    type: object
                    description: Champs visibles selon le niveau de relation (owner/contact/public)
                  events:
                    type: array
                    items:
                      type: object
                  overrides:
                    type: array
                    items:
                      type: object
                  availability:
                    nullable: true
                    type: object
                    description: Règle générale de disponibilité, null si masquée
                  relations:
                    type: object
                    properties:
                      '1':
                        type: array
                        items:
                          type: object
                  tags:
                    type: array
                    items:
                      type: string
                  hasPhoto:
                    type: boolean
                  profile_intro_md:
                    type: string
                  avatarSize:
                    type: string
                  avatarShape:
                    type: string
                    enum: [circle, square]
                  pubkey:
                    type: string
                    nullable: true
                  plan:
                    type: string
                    enum: [premium, free]
                  cover:
                    nullable: true
                    type: object
                    properties:
                      url:
                        type: string
                      type:
                        type: string
                  buttons:
                    type: array
                    items:
                      type: object
                  space:
                    nullable: true
                    type: object
                  lastSeen:
                    type: string
                  hasVault:
                    type: boolean
                  viewer:
                    nullable: true
                    type: object
                    properties:
                      handle:
                        type: string
                      isContact:
                        type: boolean
                      isRelated:
                        type: boolean
                  options:
                    type: object
                    properties:
                      allowChat:
                        type: boolean
                      allowCall:
                        type: boolean
                      allowVideo:
                        type: boolean
                      allowRequests:
                        type: boolean
                      publicAvailability:
                        type: boolean
                  private:
                    type: boolean
                    enum: [false]
        '404':
          description: Identité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/identities/{handle}/cover:
    get:
      operationId: getIdentityCover
      summary: Récupère le média de couverture Premium d'une identité
      tags:
        - Photo & Galerie
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: query
          required: false
          schema:
            type: integer
          description: Cache buster (mtime du fichier)
      responses:
        '200':
          description: Fichier de couverture (image ou vidéo)
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        '404':
          description: Aucune couverture (absente ou identité non Premium)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/cover:
    post:
      operationId: uploadCover
      summary: Téléverse la couverture Premium (image ou vidéo courte)
      tags:
        - Photo & Galerie
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - cover
              properties:
                cover:
                  type: string
                  format: binary
                  description: Image (jpg/png/webp/gif) ou vidéo (mp4/webm), max 25 Mo
      responses:
        '200':
          description: Couverture enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  url:
                    type: string
                  type:
                    type: string
                    enum: [image, video]
        '400':
          description: Fichier manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Abonnement Premium requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Fichier trop volumineux (max 25 Mo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Type de fichier non supporté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteCover
      summary: Supprime la couverture Premium de l'identité courante
      tags:
        - Photo & Galerie
      responses:
        '200':
          description: Couverture supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Abonnement Premium requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me:
    get:
      operationId: getMyIdentity
      summary: Récupère la carte privée complète de l'identité courante
      tags:
        - Identités
      responses:
        '200':
          description: Carte privée de l'identité
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle:
                    type: string
                  accessKey:
                    type: string
                  plan:
                    type: string
                    enum: [premium, free]
                  subscription:
                    type: object
                    properties:
                      plan:
                        type: string
                        enum: [premium, free]
                      status:
                        type: string
                      premiumUntil:
                        type: string
                        nullable: true
                      cancelAtPeriodEnd:
                        type: boolean
                  fields:
                    type: object
                  events:
                    type: array
                    items:
                      type: object
                  invitedEvents:
                    type: array
                    items:
                      type: object
                  myInvites:
                    type: array
                    items:
                      type: object
                  overrides:
                    type: array
                    items:
                      type: object
                  relations:
                    type: object
                  incoming:
                    type: array
                    items:
                      type: object
                  tags:
                    type: array
                    items:
                      type: string
                  notifications:
                    type: array
                    items:
                      type: object
                  unread:
                    type: integer
                  conversations:
                    type: array
                    items:
                      type: object
                  hasPubkey:
                    type: boolean
                  hasVault:
                    type: boolean
                  pubkey:
                    type: string
                  requests:
                    type: array
                    items:
                      type: object
                  pending:
                    type: integer
                  recoveryEmail:
                    type: string
                    nullable: true
                  hasPhoto:
                    type: boolean
                  profile_intro_md:
                    type: string
                  cover:
                    nullable: true
                    type: object
                    properties:
                      url:
                        type: string
                      type:
                        type: string
                  buttons:
                    type: array
                    items:
                      type: object
                  space:
                    nullable: true
                    type: object
                  settings:
                    type: object
                  private:
                    type: boolean
                    enum: [true]
                  publicUrl:
                    type: string
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/settings:
    patch:
      operationId: updateMySettings
      summary: Met à jour les préférences de l'identité courante
      tags:
        - Identités
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Correctif partiel de préférences (booléens/valeurs connues uniquement)
              properties:
                allow_chat:
                  type: boolean
                allow_call:
                  type: boolean
                allow_video:
                  type: boolean
                allow_requests:
                  type: boolean
                public_availability:
                  type: boolean
                avatar_size:
                  type: string
                avatar_shape:
                  type: string
                  enum: [circle, square]
                availability:
                  type: object
                  properties:
                    slot_minutes:
                      type: integer
      responses:
        '200':
          description: Préférences mises à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  settings:
                    type: object
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/export:
    get:
      operationId: exportMyData
      summary: Exporte toutes les données RGPD de l'identité courante en JSON
      tags:
        - Identités
      responses:
        '200':
          description: Fichier JSON à télécharger
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at:
                    type: string
                    format: date-time
                  handle:
                    type: string
                  recovery_email:
                    type: string
                    nullable: true
                  fields:
                    type: object
                  events:
                    type: array
                    items:
                      type: object
                  relations:
                    type: array
                    items:
                      type: object
                  requests:
                    type: array
                    items:
                      type: object
                  notifications:
                    type: array
                    items:
                      type: object
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tags:
    post:
      operationId: addProfileTag
      summary: Ajoute un tag au profil (fonctionnalité Premium)
      tags:
        - Identités
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tag
              properties:
                tag:
                  type: string
      responses:
        '201':
          description: Tag ajouté
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string
        '400':
          description: Tag manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Abonnement Premium requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tags/{tag}:
    delete:
      operationId: removeProfileTag
      summary: Supprime un tag du profil (fonctionnalité Premium)
      tags:
        - Identités
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Abonnement Premium requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tag introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/profile-intro:
    put:
      operationId: updateProfileIntro
      summary: Met à jour l'introduction Markdown du profil
      tags:
        - Identités
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intro_md:
                  type: string
                  description: Texte Markdown, longueur maximale contrôlée par PROFILE_INTRO_MAX_CHARS
      responses:
        '200':
          description: Introduction mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_intro_md:
                    type: string
        '400':
          description: Introduction trop longue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/identities:
    post:
      operationId: registerIdentity
      summary: Crée une nouvelle identité (inscription)
      tags:
        - Identités
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - handle
                - display_name
                - email
                - ack_adult_content
              properties:
                handle:
                  type: string
                display_name:
                  type: string
                email:
                  type: string
                  format: email
                ack_adult_content:
                  type: boolean
                  description: Doit être true (engagement contenu 18+ sur avatar/couverture)
      responses:
        '201':
          description: Identité créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle:
                    type: string
                  accessKey:
                    type: string
                  publicUrl:
                    type: string
                  privateUrl:
                    type: string
        '400':
          description: Engagement non accepté ou données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recover:
    post:
      operationId: requestAccountRecovery
      summary: Envoie un code de récupération de compte par email
      tags:
        - Identités
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - handle
                - email
              properties:
                handle:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: >-
            Réponse identique que le compte existe ou non (anti-énumération).
            devCode présent seulement si le SMTP n'est pas configuré (dev).
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                  devCode:
                    type: string
        '400':
          description: handle ou email manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recover/verify:
    post:
      operationId: verifyAccountRecovery
      summary: Vérifie le code de récupération et régénère la clé d'accès
      tags:
        - Identités
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - handle
                - email
                - code
              properties:
                handle:
                  type: string
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        '200':
          description: >-
            Clé régénérée ; renvoyée en clair seulement si l'email n'a pas pu
            être envoyé (SMTP non configuré ou échec d'envoi)
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                  handle:
                    type: string
                  accessKey:
                    type: string
                  privateUrl:
                    type: string
        '400':
          description: handle, email ou code manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/identities/{handle}/requests:
    post:
      operationId: createBookingRequest
      summary: Soumet une demande de RDV à une identité
      tags:
        - Demandes de RDV
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  maxLength: 200
                message:
                  type: string
                  maxLength: 4000
                day:
                  type: string
                  nullable: true
                  description: Date souhaitée (YYYY-MM-DD)
                time:
                  type: string
                  nullable: true
                  description: Créneau horaire souhaité
      responses:
        '201':
          description: Demande enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          description: Nom manquant, auto-demande, ou champ trop long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Ce profil n'accepte pas les demandes de RDV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/identities/{handle}/slots:
    get:
      operationId: getAvailableSlots
      summary: Liste les créneaux disponibles d'une identité pour un jour donné
      tags:
        - Demandes de RDV
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: day
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Statut du jour et créneaux (vides si privé/fermé/complet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  day:
                    type: string
                  status:
                    type: string
                    enum: [private, closed, free]
                  slotMinutes:
                    type: integer
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                        taken:
                          type: boolean
        '400':
          description: Paramètre day invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requests/{id}:
    patch:
      operationId: updateRequestStatus
      summary: Change le statut d'une demande de RDV (accepter/refuser/remettre en attente)
      tags:
        - Demandes de RDV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, accepted, declined]
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  contacts:
                    type: boolean
                    description: Présent si status=accepted
                  requesterCreated:
                    type: boolean
                    description: Présent si status=accepted
        '400':
          description: Statut invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Demande introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteBookingRequest
      summary: Supprime une demande de RDV
      tags:
        - Demandes de RDV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Demande supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Demande introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/session:
    get:
      operationId: getSession
