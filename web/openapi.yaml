                type: string
                format: binary
        '403':
          description: Réservé aux contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pièce jointe introuvable ou expirée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

