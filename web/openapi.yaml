  /api/live/{id}/signal:
    get:
      operationId: streamLiveSignal
      summary: Flux SSE de signalisation WebRTC (offer/answer/ice) adressé au device
      tags: [Lives]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Flux SSE d'événements de signalisation (events "ready", "signal", "ping")
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: device_id manquant ou invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis pour ce live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Live introuvable ou non actif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: sendLiveSignal
      summary: Envoie un paquet de signalisation WebRTC à un device du roster
      tags: [Lives]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
                  description: device_id de l'expéditeur (doit appartenir à l'identité courante)
                to:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
                  description: device_id du destinataire
                kind:
                  type: string
                  maxLength: 16
                  enum: [offer, answer, ice, wrap, bye, chat]
                payload:
                  description: Charge utile opaque (SDP, ICE candidate, etc.), max 16 Ko sérialisé
              required: [from, to, kind]
      responses:
        '200':
          description: Résultat de la remise du paquet
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered:
                    type: boolean
                    description: true si un listener actif a reçu le paquet
        '400':
          description: Paquet de signal invalide (from/to/kind manquants)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis pour ce live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Live introuvable ou non actif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Le device 'from' n'appartient pas au roster de l'identité courante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: payload trop volumineux
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/{id}/thumbnail:
    post:
      operationId: uploadLiveThumbnail
      summary: Pousse une vignette JPEG du flux en cours (owner, remplace la précédente)
      tags: [Lives]
      parameters:
        - name: id
