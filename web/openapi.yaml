  /api/storage/config:
    get:
      operationId: getStorageConfig
      summary: Récupère le catalogue des fournisseurs et la configuration de stockage courante
      tags: [Stockage tiers]
      parameters: []
      responses:
        '200':
          description: Catalogue et configuration courante (secrets masqués)
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog:
                    type: array
                    description: Catalogue des fournisseurs disponibles (TOP 10)
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [http, s3, gdrive, dropbox, onedrive]
                        providerId:
                          type: string
                          description: Identifiant du preset catalogue (ex. s3-aws, s3-r2)
                        label:
                          type: string
                      additionalProperties: true
                  config:
                    type: object
                    nullable: true
                    description: Configuration courante, secrets masqués en "••••"
                    properties:
                      kind:
                        type: string
                        enum: [http, s3, gdrive, dropbox, onedrive]
                      providerId:
                        type: string
                      baseUrl:
                        type: string
                        description: Uniquement pour kind=http
                      region:
                        type: string
                        description: Uniquement pour kind=s3
                      bucket:
                        type: string
                        description: Uniquement pour kind=s3
                      endpoint:
                        type: string
                        description: Uniquement pour kind=s3
                      publicBaseUrl:
                        type: string
                        description: Uniquement pour kind=s3
                      prefix:
                        type: string
                        description: Uniquement pour kind=s3
                      accessKeyId:
                        type: string
                        description: "Masqué en ••••, uniquement pour kind=s3"
                      secretAccessKey:
                        type: string
                        description: "Masqué en ••••, uniquement pour kind=s3"
                      folderId:
                        type: string
                        description: Uniquement pour kind=gdrive/dropbox/onedrive
                      refreshToken:
                        type: string
                        description: "Masqué en ••••, uniquement pour kind=gdrive/dropbox/onedrive"
                  configured:
                    type: boolean
                    description: Un fournisseur réellement utilisable (secrets présents) est configuré
                  directUpload:
                    type: boolean
                    description: Le fournisseur supporte l'upload direct signé (tout sauf http)
                required: [catalog, config, configured, directUpload]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateStorageConfig
      summary: Enregistre la configuration de stockage tiers (crée arborescence + CORS)
      tags: [Stockage tiers]
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  description: >
                    Configuration brute à valider côté serveur. Champs requis selon `kind` :
                    http → baseUrl ; s3 → bucket, accessKeyId, secretAccessKey (+ region, endpoint,
                    publicBaseUrl, prefix optionnels) ; gdrive/dropbox/onedrive → refreshToken
                    (+ folderId optionnel). Un champ secret valant "••••" ou vide conserve
                    la valeur précédente.
                  properties:
                    kind:
                      type: string
                      enum: [http, s3, gdrive, dropbox, onedrive]
                    providerId:
                      type: string
                    baseUrl:
                      type: string
                    region:
                      type: string
                    bucket:
                      type: string
                    endpoint:
                      type: string
                    publicBaseUrl:
                      type: string
                    prefix:
                      type: string
                    accessKeyId:
                      type: string
                    secretAccessKey:
                      type: string
                    folderId:
                      type: string
                    refreshToken:
                      type: string
                  required: [kind]
              required: [config]
      responses:
        '200':
          description: Configuration enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  config:
                    type: object
                    nullable: true
                    description: Configuration sauvegardée, secrets masqués
                  configured:
                    type: boolean
                  cors:
                    type: object
                    nullable: true
                    description: Résultat de l'application de la politique CORS (si stockage configuré)
                    properties:
                      ok:
                        type: boolean
                      error:
                        type: string
                required: [ok, config, configured]
        '400':
          description: Configuration invalide (ex. "bucket requis", "clés S3 requises", "baseUrl doit être http(s)")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/storage/test:
    post:
      operationId: testStorageConnection
      summary: Teste la connexion au fournisseur configuré (recrée arborescence + CORS si ok)
      tags: [Stockage tiers]
      parameters: []
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  cors:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      error:
                        type: string
                required: [ok]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Échec du test de connexion
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  error:
                    type: string
                required: [ok]

  /api/storage/sign:
    post:
      operationId: signStorageUpload
      summary: Signe un upload direct navigateur → fournisseur (S3 presign ou session OAuth)
      tags: [Stockage tiers]
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  maxLength: 200
                contentType:
                  type: string
                  description: Type MIME déclaré (image/vidéo/audio requis sauf scope=private-files)
                size:
                  type: integer
                  description: Taille en octets, max 200 Mo (209715200)
                scope:
                  type: string
                  enum: [public-gallery, private-files, private]
                  description: Détermine le préfixe de clé (vitrine, fichiers chiffrés, galerie chiffrée)
              required: [filename, contentType, size]
      responses:
        '200':
          description: Éléments d'upload direct signés
          content:
            application/json:
              schema:
                type: object
                description: Forme dépendante du moteur (S3 presign PUT ou session/URL OAuth)
                properties:
                  url:
                    type: string
                    description: URL de destination de l'upload
                  method:
                    type: string
                    enum: [PUT, POST]
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: string
                    description: Champs de formulaire additionnels (upload multipart, le cas échéant)
                  key:
                    type: string
                    description: Clé/chemin final de l'objet chez le fournisseur
                  ref:
                    type: string
                    description: Référence à transmettre à /api/storage/finalize pour les flux OAuth
                additionalProperties: true
        '400':
          description: Nom de fichier manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Aucun stockage connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Taille invalide (max 200 Mo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Type de contenu non supporté (image/vidéo requis hors private-files)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Échec côté fournisseur de stockage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/storage/gallery/{handle}:
