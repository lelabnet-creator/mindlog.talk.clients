          description: Enveloppe chiffrée de la clé média (déchiffrable uniquement côté client)
          content:
            application/json:
              schema:
                type: object
                properties:
                  sender_pub:
                    type: string
                    description: Clé publique de l'expéditeur (le créateur)
                  iv:
                    type: string
                    description: Vecteur d'initialisation du chiffrement de l'enveloppe
                  ct:
                    type: string
                    description: Texte chiffré de l'enveloppe
                required: [sender_pub, iv, ct]
        '403':
          description: Accès refusé (ni propriétaire, ni abonné actif)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Créateur introuvable, ou clé pas encore enveloppée pour ce membre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

