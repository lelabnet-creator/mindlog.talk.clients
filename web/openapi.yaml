        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Aucun stockage connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Échec de suppression côté fournisseur
          content:
            application/json:
              schema:
                type: object
