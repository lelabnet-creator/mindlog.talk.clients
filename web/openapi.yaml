          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/attachments/{handle}/{id}:
    get:
      operationId: getAttachment
      summary: Télécharge une pièce jointe chiffrée par son identifiant
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
