                  type: string
      responses:
        '200':
          description: Session issue du PIN redémé
          content:
            application/json:
              schema:
                type: object
                description: Identité/session retournée par l'IdP
                additionalProperties: true
        '400':
          description: PIN invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
