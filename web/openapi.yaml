          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Démarre la cérémonie WebAuthn d'enregistrement d'une passkey
      tags:
        - Passkeys
      responses:
        '200':
          description: Options WebAuthn PublicKeyCredentialCreationOptions
          content:
            application/json:
              schema:
                type: object
                description: Options de création de credential WebAuthn (challenge, rp, user, pubKeyCredParams...)
                additionalProperties: true
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Erreur métier IdP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Termine la cérémonie WebAuthn et enregistre la passkey
      tags:
        - Passkeys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                name:
                  type: string
                  default: Passkey
                response:
                  type: object
                  description: RegistrationResponseJSON WebAuthn (attestation)
                  additionalProperties: true
      responses:
        '200':
          description: Passkey enregistrée
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Corps JSON manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/passkeys/{credId}:
    delete:
      operationId: deletePasskey
      summary: Supprime une passkey de l'identité courante
      tags:
        - Passkeys
      parameters:
        - name: credId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Passkey supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/passkeys/auth/begin:
    post:
      operationId: beginPasskeyAuth
      summary: Démarre la cérémonie WebAuthn de connexion par passkey
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle:
                  type: string
      responses:
        '200':
          description: Options WebAuthn PublicKeyCredentialRequestOptions
          content:
            application/json:
              schema:
                type: object
                description: Options d'authentification WebAuthn (challenge, allowCredentials...)
                additionalProperties: true
        '400':
          description: handle requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/passkeys/auth/finish:
    post:
      operationId: finishPasskeyAuth
      summary: Termine la cérémonie WebAuthn et ouvre une session
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, response]
              properties:
                handle:
                  type: string
                response:
                  type: object
                  description: AuthenticationResponseJSON WebAuthn (assertion)
                  additionalProperties: true
      responses:
        '200':
          description: Session ouverte via passkey
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle:
                    type: string
                  accessKey:
                    type: string
        '400':
          description: handle requis ou corps JSON manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/pin:
