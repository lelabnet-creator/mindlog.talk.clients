          description: Enveloppes enregistrées
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  count:
                    type: integer
                    description: Nombre d'enveloppes enregistrées
                required: [ok, count]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/storage/media-key-targets:
    get:
      operationId: listStorageMediaKeyTargets
      summary: Liste les cibles d'enveloppe de la clé média (créateur + abonnés actifs avec clé publique)
      tags: [Stockage tiers]
      parameters: []
      responses:
        '200':
          description: Cibles à envelopper côté client
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
