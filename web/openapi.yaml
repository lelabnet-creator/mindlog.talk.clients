        '400':
          description: Corps vide ou JPEG invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: N'est pas le propriétaire du live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Live introuvable
          content:
            application/json:
