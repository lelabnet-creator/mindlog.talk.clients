  /api/billing/webhook:
    post:
      operationId: receiveStripeWebhook
      summary: Réceptionne un événement webhook Stripe signé et met à jour l'abonnement associé
      tags: [Facturation]
      security: []
      description: >
        Appelé uniquement par Stripe (pas de session utilisateur). Le corps doit être lu brut
        (non parsé) pour la vérification de signature HMAC via l'en-tête Stripe-Signature et
        le secret webhook configuré. Toute erreur de traitement applicatif est absorbée et
        200/ok est quand même renvoyé pour éviter les re-livraisons de Stripe.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          description: Signature HMAC du corps brut, générée par Stripe.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Corps brut signé représentant un objet Event Stripe
                (ex. { "type": "customer.subscription.updated", "data": { "object": {...} } }).
                Doit être transmis tel quel (non reformaté) pour que la vérification de signature réussisse.
              properties:
                type:
                  type: string
                  description: Type d'événement Stripe.
                data:
                  type: object
                  properties:
                    object:
                      type: object
      responses:
        '200':
          description: Événement accepté (traité, ou erreur applicative absorbée pour éviter une re-livraison).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          description: Signature invalide ou corps JSON illisible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

