                kind:
                  type: string
                  description: "Type d'événement (ex. account.deleted). Les types inconnus sont acquittés sans effet."
                subject:
                  type: integer
                  description: Identifiant numérique du sujet concerné (ex. identity id)
      responses:
        '200':
          description: Événement traité (idempotent) ou ignoré silencieusement si type inconnu
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ignored:
                    type: string
                    description: Présent uniquement si le kind n'est pas reconnu
        '400':
          description: "subject manquant ou invalide"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Secret interne manquant ou invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /oauth/agenda:
    get:
      operationId: getOAuthAgenda
      summary: Récupérer l'agenda de l'utilisateur via un token OAuth (scope mindlog:agenda)
      tags:
        - OAuth 2.1
      security:
        - oauth2Bearer: []
      responses:
        '200':
          description: Liste des événements d'agenda accessibles au token
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        starts_at: { type: string, format: date-time }
                        ends_at: { type: string, format: date-time, nullable: true }
                        location: { type: string }
                        link: { type: string }
                        is_public: { type: boolean }
                        kind: { type: string, enum: [event, live] }
        '401':
          description: Token Bearer absent ou invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Scope insuffisant (mindlog:agenda requis)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  scope: { type: string }
    options:
      operationId: preflightOAuthAgenda
      summary: Préflight CORS pour la ressource agenda OAuth
      tags:
        - OAuth 2.1
      security: []
      responses:
        '204':
          description: Réponse CORS sans contenu
  /api/pubkey:
    put:
      operationId: putPubkey
      summary: Publier ma clé publique E2E (le serveur ne reçoit jamais la clé privée)
      tags: [Coffre E2E]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey]
              properties:
                pubkey: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Clé publique enregistrée
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } }
        "400": { description: pubkey invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/vault:
    get:
      operationId: getE2eVault
      summary: Récupérer le coffre de clé E2E chiffré (escrow) et l'état du verrou PIN
      tags: [Coffre E2E]
      responses:
        "200":
          description: Contenu du coffre (blob opaque chiffré côté client)
          content:
            application/json:
              schema:
                type: object
                properties:
                  vault: { type: string, nullable: true, description: "Blob AES-GCM opaque, illisible côté serveur" }
                  pin_locked_until: { type: string, format: date-time, nullable: true }
                  pin_fail_count: { type: integer }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      operationId: putE2eVault
      summary: Écrire/mettre à jour le coffre de clé E2E chiffré
      tags: [Coffre E2E]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault]
              properties:
                vault: { type: string, minLength: 1, maxLength: 8000, description: "Blob AES-GCM opaque" }
      responses:
        "200": { description: Coffre enregistré, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "400": { description: Coffre invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: deleteE2eVault
      summary: Supprimer le coffre de clé E2E
      tags: [Coffre E2E]
      responses:
        "200": { description: Coffre supprimé, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/vault/pin-fail:
    post:
      operationId: recordVaultPinFail
      summary: Enregistrer un échec de saisie du PIN du coffre (verrouillage progressif)
      tags: [Coffre E2E]
      responses:
        "200": { description: "Échec enregistré, éventuelle date de déverrouillage", content: { application/json: { schema: { type: object, properties: { locked_until: { type: string, format: date-time, nullable: true } } } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/vault/pin-success:
    post:
      operationId: resetVaultPinSuccess
      summary: Réinitialiser le compteur d'échecs PIN après une saisie réussie
      tags: [Coffre E2E]
      responses:
        "200": { description: Compteur réinitialisé, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/prekeys:
    put:
      operationId: putE2ePrekeys
      summary: Publier/rafraîchir mon bundle de prekeys X3DH (SPK + lot d'OPK)
      tags: [Multi-appareils & Prekeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spkPub, spkId]
              properties:
                spkPub: { type: string, minLength: 1, maxLength: 2000 }
                spkId: { type: integer }
                spkSig: { type: string, maxLength: 2000 }
                opks:
                  type: array
                  maxItems: 200
                  items: { type: object, required: [opkId, opkPub], properties: { opkId: { type: integer }, opkPub: { type: string, maxLength: 2000 } } }
      responses:
        "200": { description: Bundle enregistré, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "400": { description: spk/spkId/opk/signature invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/prekeys/count:
    get:
      operationId: getE2ePrekeysCount
      summary: Nombre d'OPK restantes dans mon pool
      tags: [Multi-appareils & Prekeys]
      responses:
        "200": { description: Compteur d'OPK disponibles, content: { application/json: { schema: { type: object, properties: { available: { type: integer } } } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/prekeys/{handle}:
    get:
      operationId: getE2ePrekeysForContact
      summary: Récupérer le bundle de prekeys d'un contact en consommant une OPK (usage unique)
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Bundle de prekeys du contact (une OPK consommée)
          content:
            application/json:
              schema:
                type: object
                properties:
                  spkPub: { type: string }
                  spkId: { type: integer }
                  spkSig: { type: string, nullable: true }
                  opk: { type: object, nullable: true, properties: { opkId: { type: integer }, opkPub: { type: string } } }
        "403": { description: Réservé aux contacts réciproques, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Pas de bundle disponible, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/devices:
    post:
      operationId: registerDevice
      summary: Enrôler/rafraîchir mon appareil (premier auto-approuvé, suivants en attente)
      tags: [Multi-appareils & Prekeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, e2ePubkey]
              properties:
                deviceId: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
                e2ePubkey: { type: string, minLength: 1, maxLength: 2000 }
                name: { type: string, maxLength: 80 }
      responses:
        "200": { description: Appareil enrôlé, content: { application/json: { schema: { type: object, properties: { id: { type: integer }, deviceId: { type: string }, approved: { type: boolean }, pending: { type: boolean } } } } } }
        "400": { description: deviceId/clé invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listDevices
      summary: Lister mes appareils actifs
      tags: [Multi-appareils & Prekeys]
      responses:
        "200": { description: Liste de mes appareils, content: { application/json: { schema: { type: object, properties: { devices: { type: array, items: { type: object, properties: { id: { type: integer }, deviceId: { type: string }, name: { type: string }, approved: { type: boolean } } } } } } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/devices/{pk}/approve:
    post:
      operationId: approveDevice
      summary: Approuver un appareil en attente (nécessite un appareil déjà approuvé)
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: pk, in: path, required: true, schema: { type: integer } }
        - { name: x-device-id, in: header, required: false, schema: { type: string }, description: "Appareil approbateur (doit déjà être approuvé)" }
      responses:
        "200": { description: Appareil approuvé, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "400": { description: Identifiant invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Approbation refusée, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/devices/{pk}:
    delete:
      operationId: revokeDevice
      summary: Révoquer un appareil
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: pk, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Résultat de la révocation, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "400": { description: Identifiant invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/device-prekeys:
    put:
      operationId: putDevicePrekeys
      summary: Publier/rafraîchir le bundle de prekeys de mon appareil courant
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: x-device-id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spkPub, spkId]
              properties:
                spkPub: { type: string, minLength: 1, maxLength: 2000 }
                spkId: { type: integer }
                spkSig: { type: string, maxLength: 2000 }
                opks: { type: array, maxItems: 200, items: { type: object, required: [opkId, opkPub], properties: { opkId: { type: integer }, opkPub: { type: string, maxLength: 2000 } } } }
      responses:
        "200": { description: Bundle de l'appareil enregistré, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "400": { description: Appareil inconnu ou données invalides, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/device-prekeys/count:
    get:
      operationId: getDevicePrekeysCount
      summary: Nombre d'OPK restantes pour mon appareil courant
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: x-device-id, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Compteur d'OPK, content: { application/json: { schema: { type: object, properties: { available: { type: integer } } } } } }
        "400": { description: Appareil inconnu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/device-prekeys/{handle}:
    get:
      operationId: getDevicePrekeysForContact
      summary: Récupérer les bundles de tous les appareils d'un contact (fan-out X3DH)
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Bundles par appareil du contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { type: object, properties: { deviceId: { type: string }, spkPub: { type: string }, spkId: { type: integer }, spkSig: { type: string, nullable: true }, opk: { type: object, nullable: true, properties: { opkId: { type: integer }, opkPub: { type: string } } } } }
        "403": { description: Réservé aux contacts réciproques, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/my-devices:
    get:
      operationId: getMyDevices
      summary: Récupérer les bundles de mes autres appareils (sync fan-out)
      tags: [Multi-appareils & Prekeys]
      parameters:
        - { name: x-device-id, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Bundles de mes autres appareils
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { type: object, properties: { deviceId: { type: string }, spkPub: { type: string }, spkId: { type: integer }, spkSig: { type: string, nullable: true }, opk: { type: object, nullable: true, properties: { opkId: { type: integer }, opkPub: { type: string } } } } }
        "401": { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/e2e/verify/{handle}:
    put:
      operationId: putVerification
      summary: Enregistrer le numéro de sécurité vérifié hors-bande avec un contact
      tags: [Vérification (Safety Number)]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [safety]
              properties:
                safety: { type: string, pattern: '^[0-9a-f]{64}$', description: "Hash SHA-256 hex du numéro de sécurité" }
      responses:
        "200": { description: Vérification enregistrée, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "400": { description: Hash invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Réservé aux contacts réciproques, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: getVerification
      summary: Récupérer l'état de vérification avec un contact
      tags: [Vérification (Safety Number)]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: État de vérification, content: { application/json: { schema: { type: object, properties: { safety: { type: string, nullable: true }, verifiedAt: { type: string, format: date-time, nullable: true } } } } } }
        "403": { description: Réservé aux contacts réciproques, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: deleteVerification
      summary: Supprimer la vérification avec un contact
      tags: [Vérification (Safety Number)]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Vérification supprimée, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: true } } } } } }
        "403": { description: Réservé aux contacts réciproques, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/groups:
    post:
      operationId: createGroup
      summary: Crée un nouveau groupe (membres = contacts réciproques)
      tags: [Groupes (E2E)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nom du groupe (tronqué à 80 caractères, défaut "")
                members:
                  type: array
                  items:
                    type: string
                  description: Handles (ex. "@bob") des membres à ajouter ; doivent être des contacts réciproques du créateur
      responses:
        '201':
          description: Groupe créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        handle: { type: string }
                        role: { type: string, enum: [owner, admin, member] }
                  role: { type: string, enum: [owner, admin, member] }
                  owner: { type: string, description: "Handle du propriétaire" }
        '400':
          description: Contact introuvable, non réciproque, ou groupe trop grand (>128 membres)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listGroups
      summary: Liste les groupes dont l'utilisateur courant est membre
      tags: [Groupes (E2E)]
      parameters: []
      responses:
        '200':
          description: Liste des groupes
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              handle: { type: string }
                              role: { type: string, enum: [owner, admin, member] }
                        role: { type: string, enum: [owner, admin, member] }
                        owner: { type: string }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}:
    get:
      operationId: getGroup
      summary: Récupère le détail d'un groupe (membres, rôle, historique)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail du groupe
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        handle: { type: string }
                        role: { type: string, enum: [owner, admin, member] }
                  role: { type: string, enum: [owner, admin, member] }
                  owner: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string }
                        actor: { type: string }
                        target: { type: string, nullable: true }
                        payload: { type: object, nullable: true, additionalProperties: true }
                        created_at: { type: string, format: date-time }
        '404':
          description: Groupe introuvable ou utilisateur non membre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: renameGroup
      summary: Renomme un groupe (admin/owner uniquement)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Nouveau nom (non vide, tronqué à 80 caractères)
      responses:
        '200':
          description: Groupe renommé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Nom invalide (vide)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé aux administrateurs/owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Groupe introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/members:
    post:
      operationId: addGroupMember
      summary: Ajoute un membre au groupe (admin/owner ; contact réciproque requis)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle:
                  type: string
                  description: Handle du contact à ajouter (ex. "@bob")
      responses:
        '200':
          description: Membre ajouté
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Contact non réciproque ou groupe trop grand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé aux administrateurs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Contact introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/members/{handle}:
    delete:
      operationId: removeGroupMember
      summary: Retire un membre du groupe (admin/owner ; pas l'owner, pas soi-même)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: handle
          in: path
          required: true
          schema: { type: string }
          description: Handle du membre à retirer
      responses:
        '200':
          description: Membre retiré
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: L'owner ne peut pas être retiré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé aux administrateurs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Membre ou groupe introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/promote:
    post:
      operationId: promoteGroupMember
      summary: Promeut un membre simple au rang d'administrateur (owner uniquement)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle:
                  type: string
                  description: Handle du membre à promouvoir
      responses:
        '200':
          description: Membre promu administrateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Le membre n'est pas un membre simple
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé à l'owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Contact introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/demote:
    post:
      operationId: demoteGroupMember
      summary: Rétrograde un administrateur en membre simple (owner uniquement)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle:
                  type: string
                  description: Handle de l'administrateur à rétrograder
      responses:
        '200':
          description: Administrateur rétrogradé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Le membre n'est pas administrateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé à l'owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Contact introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/transfer:
    post:
      operationId: transferGroupOwnership
      summary: Transfère la propriété du groupe à un autre membre (owner uniquement)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle:
                  type: string
                  description: Handle du nouveau propriétaire (doit déjà être membre)
      responses:
        '200':
          description: Propriété transférée (l'ancien owner devient admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Cible invalide ou pas membre du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé à l'owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/leave:
    post:
      operationId: leaveGroup
      summary: Quitte un groupe (l'owner doit transférer la propriété avant, sauf s'il est seul)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Groupe quitté (dissous si plus aucun membre)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: L'owner doit transférer la propriété avant de quitter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Utilisateur non membre du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/messages:
    get:
      operationId: listGroupMessages
      summary: Liste les messages éphémères (chiffrés) d'un groupe
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Messages du groupe
          content:
            application/json:
              schema:
                type: object
                properties:
                  me: { type: integer, description: "Id de l'identité courante" }
                  ttlHours: { type: integer, description: "Durée de vie max des messages (heures)" }
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        sender_id: { type: integer }
                        sender_handle: { type: string }
                        iv: { type: string }
                        ciphertext: { type: string }
                        sender_pub: { type: string }
                        recipient_pub: { type: string }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        delivered: { type: integer }
                        read: { type: integer }
                        read_once: { type: integer }
                        client_msg_id: { type: string, nullable: true }
                        sender_device_pk: { type: integer, nullable: true }
                        reactions:
                          type: array
                          items:
                            type: object
                            properties:
                              emoji: { type: string }
                              count: { type: integer }
                              mine: { type: boolean }
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: sendGroupMessage
      summary: Envoie un message chiffré éphémère dans un groupe
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iv, ciphertext]
              properties:
                iv:
                  type: string
                  description: Vecteur d'initialisation (base64)
                ciphertext:
                  type: string
                  description: Corps chiffré du message (base64)
                ttl:
                  type: number
                  description: Durée de vie en secondes (bornée [60, 86400], défaut 86400)
                readOnce:
                  type: boolean
                  description: Message à lecture unique (auto-destruction après lecture)
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Message trop long ou invalide (iv/ciphertext manquant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/messages/{mid}:
    delete:
      operationId: deleteGroupMessage
      summary: Supprime un message de groupe (auteur uniquement)
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: mid
          in: path
          required: true
          schema: { type: integer }
          description: Id du message
      responses:
        '200':
          description: Message supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Message introuvable ou non auteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/messages/{mid}/burn:
    post:
      operationId: burnGroupMessage
      summary: Brûle (supprime) un message à lecture unique après révélation
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: mid
          in: path
          required: true
          schema: { type: integer }
          description: Id du message
      responses:
        '200':
          description: Message brûlé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Message introuvable ou déjà brûlé (pas read_once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/messages/{mid}/react:
    post:
      operationId: reactToGroupMessage
      summary: Ajoute/retire une réaction (emoji) sur un message de groupe
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: mid
          in: path
          required: true
          schema: { type: integer }
          description: Id du message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
                  description: Emoji de réaction (tronqué à 8 caractères)
      responses:
        '200':
          description: Réaction basculée (ajoutée ou retirée)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        '400':
          description: Réaction invalide ou message hors du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/attachments:
    post:
      operationId: uploadGroupAttachment
      summary: Téléverse une pièce jointe éphémère chiffrée (blob opaque) dans un groupe
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [blob]
              properties:
                blob:
                  type: string
                  format: binary
                  description: Blob opaque chiffré côté client (max ~11 Mo)
      responses:
        '201':
          description: Pièce jointe stockée
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: "Id de la pièce jointe" }
                  expiresAt: { type: string, format: date-time }
        '400':
          description: Blob manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Fichier trop volumineux (> ~11 Mo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/groups/{id}/attachments/{attId}:
    get:
      operationId: downloadGroupAttachment
      summary: Télécharge une pièce jointe éphémère (blob opaque) d'un groupe
      tags: [Groupes (E2E)]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attId
          in: path
          required: true
          schema: { type: integer }
          description: Id de la pièce jointe
      responses:
        '200':
          description: Contenu binaire de la pièce jointe
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Réservé aux membres du groupe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pièce jointe introuvable, expirée ou fichier manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/live/start:
    post:
      operationId: startLive
      summary: Démarre un nouveau live (owner premium) et crée le manifest de diffusion
      tags: [Lives]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: Titre du live (tronqué côté serveur)
                broadcaster_pub:
                  type: string
                  maxLength: 256
                  description: Clé publique E2E du broadcaster
                manifest:
                  type: object
                  additionalProperties: true
                  description: Manifest JSON opaque signé par le broadcaster (max 8 Ko sérialisé)
                key_wrap:
                  type: object
                  additionalProperties: true
                  description: Enveloppe(s) de clé de stream Ks chiffrées (max 4 Ko sérialisé)
              required: [broadcaster_pub]
      responses:
        '200':
          description: Live créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  started_at:
                    type: string
                    format: date-time
                  epoch:
                    type: integer
        '400':
          description: broadcaster_pub manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: manifest ou key_wrap trop volumineux
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/mine:
    get:
      operationId: listMyLives
      summary: Liste les derniers lives (en cours et historique) de l'utilisateur courant
      tags: [Lives]
      responses:
        '200':
          description: Historique des lives
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        status: { type: string, enum: [live, ended] }
                        started_at: { type: string, format: date-time }
                        ended_at: { type: string, format: date-time, nullable: true }
                        epoch: { type: integer }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/feed:
    get:
      operationId: getLiveFeed
      summary: Récupère les données de l'onglet Live (mes lives, lives en cours suivis, lives planifiés)
      tags: [Lives]
      responses:
        '200':
          description: Flux Live agrégé
          content:
            application/json:
              schema:
                type: object
                properties:
                  mine:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        status: { type: string, enum: [live, ended] }
                        started_at: { type: string, format: date-time }
                  live_now:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        started_at: { type: string, format: date-time }
                        owner_handle: { type: string }
                        owner_name: { type: string }
                        has_cover: { type: boolean }
                        has_photo: { type: boolean }
                  scheduled:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        starts_at: { type: string, format: date-time }
                        notes: { type: string }
                        owner_handle: { type: string }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/{id}:
    get:
      operationId: getLive
      summary: Récupère les métadonnées publiques d'un live (visionnage public si en direct)
      tags: [Lives]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Métadonnées du live
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  status: { type: string, enum: [live, ended] }
                  epoch: { type: integer }
                  started_at: { type: string, format: date-time }
                  ended_at: { type: string, format: date-time, nullable: true }
                  broadcaster_pub: { type: string }
                  manifest:
                    type: object
                    nullable: true
                    additionalProperties: true
        '404':
          description: Live introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/{id}/notify:
    post:
      operationId: notifyLive
      summary: Renotifie manuellement les abonnés d'un live en cours (owner)
      tags: [Lives]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification relancée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: N'est pas le propriétaire du live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Live introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/{id}/end:
    post:
      operationId: endLive
      summary: Termine un live en cours (owner)
      tags: [Lives]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Live terminé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: N'est pas le propriétaire du live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Live introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/{id}/rotate:
    post:
      operationId: rotateLiveEpoch
      summary: Fait pivoter l'epoch du live et publie une nouvelle enveloppe de clé (owner, révocation)
      tags: [Lives]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                key_wrap:
                  type: object
                  additionalProperties: true
                  description: Nouvelle enveloppe de clé Ks (max 4 Ko sérialisé)
      responses:
        '200':
          description: Epoch mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch: { type: integer }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: N'est pas le propriétaire du live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Live introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: key_wrap trop volumineux
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/live/{id}/join:
    post:
      operationId: joinLive
      summary: Rejoint le live (abonné premium) et récupère le roster initial + enveloppe de clé
      tags: [Lives]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
                score:
                  type: number
                  description: Score local initial (défaut 50)
              required: [device_id]
      responses:
        '200':
          description: Roster et informations de connexion au live
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [broadcaster, viewer] }
                  epoch: { type: integer }
                  broadcaster_pub: { type: string }
                  manifest:
                    type: object
                    nullable: true
                    additionalProperties: true
                  key_wrap:
                    type: object
                    nullable: true
                    additionalProperties: true
                  roster:
                    type: array
                    items:
                      type: object
                      properties:
