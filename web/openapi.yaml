        '400':
          description: Référence manquante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Aucun stockage connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Échec de finalisation côté fournisseur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/storage/oauth/{provider}/connect:
    get:
      operationId: connectStorageOAuth
      summary: Démarre le flux OAuth vers un fournisseur de stockage tiers (gdrive, dropbox, onedrive)
      tags: [Stockage tiers]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [gdrive, dropbox, onedrive]
      responses:
        '302':
          description: >
            Redirection vers l'écran de consentement du fournisseur si tout est valide ;
            sinon redirection vers /me?storage=badprovider|auth|premium|{provider}_unavailable
            (fournisseur invalide, non authentifié, non premium, ou moteur non configuré côté serveur).
          headers:
            Location:
              schema:
                type: string

  /api/storage/oauth/{provider}/callback:
    get:
      operationId: storageOAuthCallback
      summary: Callback OAuth du fournisseur de stockage tiers (échange le code, enregistre la config)
      tags: [Stockage tiers]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [gdrive, dropbox, onedrive]
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Code d'autorisation renvoyé par le fournisseur
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: État signé (identité + fournisseur), vérifié côté serveur
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Présent si l'utilisateur a refusé le consentement
      responses:
        '302':
          description: >
            Redirection vers /me?storage={provider}_ok en cas de succès, ou vers
            /me?storage=badprovider|{provider}_denied|{provider}_state|premium|{provider}_unavailable|{provider}_error
            selon le cas d'échec (fournisseur invalide, refus, état invalide, non premium,
            moteur non configuré, échec d'échange du code).
          headers:
            Location:
              schema:
                type: string

  /api/space/{handle}/media-key:
