      tags:
        - Auth & Sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Empreinte (hash) du jeton de session
      responses:
        '200':
          description: Session révoquée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/messages/{handle}:
    get:
      operationId: getMessages
      summary: Récupère les messages chiffrés échangés avec un contact
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: x-device-id
          in: header
          required: false
          schema:
            type: string
          description: Identifiant de l'appareil courant, pour filtrer les enveloppes fan-out
      responses:
        '200':
          description: Messages de la conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttlHours:
                    type: number
                  me:
                    type: integer
                  peerPubkey:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      description: Message chiffré E2E (enveloppe legacy ou fan-out)
                      properties:
                        id:
                          type: integer
                        clientMsgId:
                          type: string
                        iv:
                          type: string
                        ciphertext:
                          type: string
                        senderPub:
                          type: string
                        recipientPub:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        read:
                          type: boolean
                        readOnce:
                          type: boolean
                        ttl:
                          type: integer
                        reactions:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                      additionalProperties: true
        '403':
          description: Réservé aux contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: sendMessage
      summary: Envoie un message chiffré (legacy mono-session ou fan-out multi-appareils)
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: x-device-id
          in: header
          required: false
          schema:
            type: string
          description: Identifiant de l'appareil émetteur (requis pour l'envoi fan-out)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Champs legacy (iv/ciphertext/senderPub/recipientPub) OU fan-out (clientMsgId/envelopes)
              properties:
                iv:
                  type: string
                ciphertext:
                  type: string
                senderPub:
                  type: string
                recipientPub:
                  type: string
                ttl:
                  type: integer
                  description: Minuterie de disparition en secondes
                readOnce:
                  type: boolean
                clientMsgId:
                  type: string
                envelopes:
                  type: array
                  items:
                    type: object
                    required: [recipientDeviceId, iv, ciphertext]
                    properties:
                      recipientDeviceId:
                        type: string
                      iv:
                        type: string
                      ciphertext:
                        type: string
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Requête invalide (appareil inconnu, clientMsgId requis, aucune enveloppe valide, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Réservé aux abonné·e·s de cet espace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Réservé aux contacts ou messagerie désactivée par le contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/messages/{handle}/ack:
    post:
      operationId: ackMessages
      summary: Marque les messages d'une conversation comme lus (ou non lus)
      tags:
        - Messagerie (E2E)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  type: boolean
      responses:
        '200':
          description: Statut de lecture mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
