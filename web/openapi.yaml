                      type: object
                      properties:
                        id:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        lastSeen:
                          type: string
                          format: date-time
                        userAgent:
                          type: string
                          nullable: true
                        current:
                          type: boolean
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sessions/{id}:
    delete:
      operationId: deleteSession
