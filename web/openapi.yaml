      summary: Vérifie un jeton d'achat Google Play côté serveur et active le premium correspondant
      tags: [Facturation]
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseToken]
              properties:
                purchaseToken:
                  type: string
                  description: Jeton d'achat renvoyé par le SDK Google Play Billing côté Android.
                productId:
                  type: string
                  description: Identifiant du produit/abonnement Google Play acheté.
      responses:
        '200':
          description: Achat vérifié et appliqué.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: string
                    description: Statut de l'abonnement après application de l'achat.
                  plan:
                    type: string
                    enum: [premium, free]
        '400':
          description: purchaseToken manquant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Erreur lors de la vérification auprès de Google Play.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Intégration Google Play non configurée sur cette instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/billing/google/rtdn:
    post:
      operationId: receiveGooglePlayRtdn
      summary: Réceptionne une notification temps réel (RTDN) Google Play Pub/Sub sur un abonnement
      tags: [Facturation]
      security: []
      description: >
        Appelé uniquement par l'infrastructure Google Play Real-time Developer Notifications
        (Pub/Sub push), pas de session utilisateur. Authentifié par un jeton partagé transmis
        en query string plutôt que par une signature de corps.
      parameters:
        - name: secret
          in: query
          required: true
          description: Jeton partagé de vérification RTDN configuré côté serveur.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Enveloppe de push Pub/Sub Google Play.
              properties:
                message:
                  type: object
                  properties:
                    data:
                      type: string
                      format: byte
                      description: >
                        Payload JSON encodé en base64 contenant notamment
                        subscriptionNotification.purchaseToken.
      responses:
        '200':
          description: Notification accusée réception (traitée, ou erreur applicative absorbée).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '403':
          description: Jeton "secret" manquant ou invalide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

