          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Réservé aux contacts ou appels désactivés par le contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/agenda:
    post:
      operationId: createAgendaEvent
      summary: Créer un événement d'agenda
      tags:
        - Agenda & Disponibilité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - starts_at
              properties:
                title:
                  type: string
                  maxLength: 200
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                  nullable: true
                location:
                  type: string
                  maxLength: 200
                link:
                  type: string
                  maxLength: 500
                notes:
                  type: string
                  maxLength: 4000
                is_public:
                  type: boolean
                kind:
                  type: string
                  description: "'live' n'est retenu que si le compte est premium et éligible ; sinon retombe silencieusement sur 'event'."
                  enum: [event, live]
                  default: event
                notify_subs:
                  type: boolean
                  description: Si kind=live, notifie les abonné·e·s à la création (trigger one-shot, non stocké).
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  starts_at:
                    type: string
                    format: date-time
                  ends_at:
                    type: string
                    format: date-time
                    nullable: true
                  location:
                    type: string
                  link:
                    type: string
                  notes:
                    type: string
                  is_public:
                    type: boolean
                  kind:
                    type: string
                    enum: [event, live]
        '400':
          description: title/starts_at manquant ou champ trop long
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

