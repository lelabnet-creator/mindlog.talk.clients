                          type: integer
                        handle:
                          type: string
                        publicKey:
                          type: string
                      additionalProperties: true
                required: [targets]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Abonnement premium requis
